name: Render Money Story Shorts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2 \
            libatspi2.0-0 \
            fonts-liberation \
            libappindicator3-1 \
            libxshmfence1 \
            wget \
            ffmpeg
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          google-chrome --version
          ffprobe -version

      - name: Build bundle
        run: npm run build

      - name: Render scene 1 still (mid-frame 44)
        run: npx remotion still MoneyStory out/scene-01-mid.png --frame=44 --props=./data/props.json --overwrite

      - name: Render all 14 scene stills (mid-frame)
        run: |
          for scene in scene-01 scene-02 scene-03 scene-04 scene-05 scene-06 scene-07 scene-08 scene-09 scene-10 scene-11 scene-12 scene-13 scene-14; do
            echo "Rendering ${scene} still (mid-frame)..."
            npx remotion still MoneyStory out/${scene}-mid.png --frame=$(node -e "console.log([44,134,239,344,449,569,674,764,854,959,1064,1154,1244,1544].includes(parseInt('${scene}'[5])) ? parseInt('${scene}'[5]) : 45)") --props=./data/props.json --overwrite
          done

      - name: Render full video
        run: npx remotion render MoneyStory out/video.mp4 --props=./data/props.json --concurrency=2

      - name: Verify output
        run: |
          ls -la out/video.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,duration -of csv=p=0 out/video.mp4

      - name: Extract check frames
        run: |
          ffmpeg -v error -ss 5 -i out/video.mp4 -frames:v 1 out/check_5s.png
          ffmpeg -v error -ss 30 -i out/video.mp4 -frames:v 1 out/check_30s.png
          ffmpeg -v error -ss 55 -i out/video.mp4 -frames:v 1 out/check_55s.png

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: money-story-video
          path: out/video.mp4
          retention-days: 30

      - name: Upload check frames artifact
        uses: actions/upload-artifact@v4
        with:
          name: check-frames
          path: out/check_*.png
          retention-days: 30