name: Render Money Story Shorts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2 \
            libatspi2.0-0 \
            fonts-liberation \
            libappindicator3-1 \
            libxshmfence1 \
            wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          google-chrome --version

      - name: Build bundle
        run: npm run build

      - name: Render scene 1 still (mid-frame 44)
        run: |
          npx remotion still MoneyStory out/scene-01-mid.png --frame=44 --props=./data/props.json --overwrite

      - name: Verify output
        run: |
          ls -la out/scene-01-mid.png
          file out/scene-01-mid.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scene-01-still
          path: out/scene-01-mid.png
          retention-days: 30