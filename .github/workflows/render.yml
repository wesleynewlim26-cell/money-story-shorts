name: Render Money Story Shorts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2 \
            libatspi2.0-0 \
            fonts-liberation \
            libappindicator3-1 \
            libxshmfence1 \
            wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          google-chrome --version

      - name: Render video
        run: npx remotion render MoneyStoryShorts out/money-story-shorts.mp4 --codec=h264 --concurrency=2

      - name: Verify output
        run: |
          ls -la out/money-story-shorts.mp4
          file out/money-story-shorts.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: money-story-shorts-video
          path: out/money-story-shorts.mp4
          retention-days: 30