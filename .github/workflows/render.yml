name: Render Money Story Shorts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2 \
            libatspi2.0-0 \
            fonts-liberation \
            libappindicator3-1 \
            libxshmfence1 \
            wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          google-chrome --version

      - name: Render still frames
        run: |
          for i in {1..14}; do
            npx remotion render "Scene${i}Still" "out/scene${i}.png" --image-format=png --concurrency=1
          done

      - name: Verify output
        run: |
          for i in {1..14}; do
            ls -la "out/scene${i}.png"
            file "out/scene${i}.png"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scene-stills
          path: out/scene*.png
          retention-days: 30